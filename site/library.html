<!doctype html>
<html lang="ru">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Babel — Library</title><link rel="stylesheet" href="assets/style.css" /></head>
<body><main class="libraryMain">
  <nav class="topnav"><a href="/">Главная</a><a href="student-rank.html">Student Rank</a><a href="proof.html">Доказательство</a><a href="alphabet.html">Алфавит</a><a href="generate.html">Генераторы</a><a href="search.html">Search</a><a href="analytics.html">Analytics</a></nav>

  <section class="libraryHero">
    <div>
      <div class="kicker">Addressable Library</div>
      <h1>Библиотека</h1>
      <p>4096-symbol pages. Decimal address + page64 coordinate with right-side vacuum omitted.</p>
    </div>
    <div class="libraryStats"><span>256 symbols</span><span>4096 positions</span><span>2³²⁷⁶⁸ pages</span></div>
  </section>

  <section class="libraryShell">
    <aside class="libraryControls">
      <div class="controlBlock">
        <h2>Find page</h2>
        <textarea id="query" class="smallText" spellcheck="false">привет лол 😂 hello</textarea>
        <button id="findAddress">Find address</button>
      </div>

      <div class="controlBlock">
        <h2>Open address</h2>
        <label>Format <select id="addrFormat"><option value="page64">page64</option><option value="dec">decimal</option></select></label>
        <textarea id="address" class="smallText addressBox" spellcheck="false">∅</textarea>
        <div class="miniButtons"><button id="openAddress">Open</button><button id="copyAddress">Copy</button><button id="randomPage">Random</button></div>
      </div>

      <div id="searchOut" class="cardResult compactInfo"></div>
    </aside>

    <section class="readerPane">
      <div class="readerTop">
        <div><span class="readerLabel">Current page</span><strong id="currentShort">…</strong></div>
        <div class="readerFormat">page64</div>
      </div>
      <textarea id="page" class="page monoPage readerPage" spellcheck="false"></textarea>
      <div class="readerNav">
        <button id="prevPage" class="pageNav">← Назад</button>
        <button id="nextPage" class="pageNav primaryNav">Вперёд →</button>
      </div>
      <div id="addressInfo" class="cardResult compactInfo"></div>
    </section>
  </section>
</main><script src="assets/shared.js"></script><script src="assets/library.js?v=20260518-reader-layout"></script></body></html>
